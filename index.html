<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#24170f" />
    <meta name="description" content="모바일 판타지 텍스트 TRPG - 모험가의 검과 솥" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="ui-polish.css" />
    <link rel="stylesheet" href="character-ui.css" />
    <link rel="stylesheet" href="expansion.css" />
    <link rel="stylesheet" href="gameplay-fixes.css" />
    <title>모험가의 검과 솥</title>
  </head>
  <body class="is-locked">
    <section id="start-screen" class="start-screen" aria-label="게임 시작 화면">
      <div class="start-rune">⚔</div>
      <p class="start-kicker">A TABLETOP FANTASY SURVIVAL</p>
      <h1>모험가의<br><em>검과 솥</em></h1>
      <p class="start-copy">굶주림과 괴물, 그리고 당신의 선택이<br>한 편의 모험담을 만듭니다.</p>
      <button id="start-button" class="start-button" type="button">TOUCH TO START <span>↵</span></button>
      <p class="start-hint">탐험 · 전투 · 요리 · 운명</p>
    </section>
    <main class="app-shell">
      <header>
        <p class="eyebrow">FANTASY SURVIVAL TEXT TRPG</p>
        <h1>모험가의 검과 솥</h1>
        <p id="location" class="location">잿불 길드의 야영지</p>
      </header>

      <section id="hero-card" class="card hero-card"></section>
      <section id="scene" class="card scene" aria-live="polite"></section>
      <section class="card actions">
        <h2>행동</h2>
        <div id="action-list" class="button-grid"></div>
      </section>
      <section class="card log-card">
        <h2>모험 기록</h2>
        <ol id="log" class="log"></ol>
      </section>
    </main>
    <script type="module" src="app.js"></script>
    <script src="start.js"></script>
    <script src="character-ui.js"></script>
    <script src="expansion.js"></script>
    <script src="portrait-assets.js"></script>
    <script src="gameplay-fixes.js"></script>
  </body>
</html>
